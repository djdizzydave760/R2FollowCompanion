name: R2Follow
options:
  bundleIdPrefix: local.droidcontrol
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  R2Follow:
    type: application
    platform: iOS
    sources:
      - R2Follow
    info:
      path: R2Follow/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.droidcontrol.r2followbeta
        PRODUCT_NAME: R2 Follow
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "R2 Follow uses compass heading while the app is open to estimate turns in your walking route."
        INFOPLIST_KEY_NSMotionUsageDescription: "R2 Follow uses motion and walking distance to estimate a delayed route for your personal R-Series droid."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "R2 Follow communicates with Droid Control running on your Mac over your private local network."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "R2 Follow listens for optional hands-free commands such as R2 speak, R2 spin, and R2 stop while the app is open."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "R2 Follow uses speech recognition to recognize optional R2 voice commands spoken into your iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
