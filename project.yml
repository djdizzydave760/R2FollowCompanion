name: R2Follow
options:
  bundleIdPrefix: local.droidcontrol
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  R2Follow:
    type: application
    platform: iOS
    sources:
      - R2Follow
    info:
      path: R2Follow/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.droidcontrol.r2followbeta
        PRODUCT_NAME: R2 Follow
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
